name: taqlyn-mcp

# Pull-only. Talks to the live Taqlyn API (not localhost).
#   docker compose up
# Local image: docker compose -f docker-compose.yml -f docker-compose.build.yml up --build

services:
  mcp:
    image: ghcr.io/taqlyn/agents:latest
    pull_policy: always
    ports:
      - "8787:8787"
    environment:
      TAQLYN_MCP_TRANSPORT: http
      TAQLYN_MCP_ADDR: ":8787"
      TAQLYN_WORKSPACE: /workspace
      TAQLYN_API_URL: ${TAQLYN_API_URL:-https://api.rutvik.qzz.io}
      TAQLYN_ENV: ${TAQLYN_ENV:-sandbox}
      TAQLYN_PERMISSION: ${TAQLYN_PERMISSION:-write}
      TAQLYN_EMAIL: ${TAQLYN_EMAIL:-}
      TAQLYN_PASSWORD: ${TAQLYN_PASSWORD:-}
      TAQLYN_SESSION_TOKEN: ${TAQLYN_SESSION_TOKEN:-}
    volumes:
      - taqlyn_mcp_config:/home/mcp/.config/taqlyn
      - ${TAQLYN_WORKSPACE_HOST:-.}:/workspace:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  taqlyn_mcp_config:
